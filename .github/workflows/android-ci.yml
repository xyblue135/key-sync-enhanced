name: Android Checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: android-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17
          cache: gradle
      # android-actions/setup-android@v3 的 sdkmanager --licenses 应答处理
      # 与 runner 预装 SDK 不兼容（见 2026-10-28 事件记录），改为直接写入许可证文件，
      # 缺失组件由 AGP 在许可已接受的前提下自行下载。
      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '%s\n' \
            '24333f8a63b6825ea9c5514f83c2829b004d1fee' \
            '8933bad161af4178b1185d1a37fbf41ea5269c55' \
            'd56f5187479451eabf01fb78af6dfcb131a6481e' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '84831b9409646a918e30573bab4c9c9131d7d3a5\n' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
      - run: chmod +x gradlew
      - name: Test, lint and build debug APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-check-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
