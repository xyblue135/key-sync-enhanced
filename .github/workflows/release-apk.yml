name: Android Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: build-env
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate version and release tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          source = Path('app/build.gradle.kts').read_text(encoding='utf-8')
          versions = re.findall(r'^\s*versionName\s*=\s*"([^"]+)"', source, re.M)
          if len(versions) != 1 or not re.fullmatch(r'[0-9A-Za-z][0-9A-Za-z._-]*', versions[0]):
              raise SystemExit('Expected one valid versionName')
          version = versions[0]
          if os.environ['REF_TYPE'] == 'tag' and os.environ['REF_NAME'] != f'v{version}':
              raise SystemExit(f'Tag must match Gradle version: v{version}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version_name={version}\n')
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17
          cache: gradle
      # 与 android-ci.yml 相同：绕开 setup-android@v3 的 sdkmanager 兼容问题
      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '%s\n' \
            '24333f8a63b6825ea9c5514f83c2829b004d1fee' \
            '8933bad161af4178b1185d1a37fbf41ea5269c55' \
            'd56f5187479451eabf01fb78af6dfcb131a6481e' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '84831b9409646a918e30573bab4c9c9131d7d3a5\n' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
      - run: chmod +x gradlew
      - name: Run release gates
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --console=plain
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/key.jks
      - name: Build signed release APK
        env:
          ORG_GRADLE_PROJECT_storeFile: ${{ github.workspace }}/app/key.jks
          ORG_GRADLE_PROJECT_storePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_keyAlias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_keyPassword: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk-v${{ steps.version.outputs.version_name }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Cleanup signing file
        if: always()
        run: rm -f app/key.jks

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-apk-v${{ needs.build.outputs.version_name }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version_name }}
          target_commitish: ${{ github.sha }}
          name: Release v${{ needs.build.outputs.version_name }}
          files: app-release.apk
          fail_on_unmatched_files: true
